# kai_bridge.conf - replaces Stremio Kai's Settings page under AIOStreams Desktop.
# Edit, then start a new video. Lines starting with # are the defaults.

# Anime4K preset for anime: optimized | fast | hq | none
#shader_preset=optimized

# Colours: kai | vivid | original (F8 cycles them while playing)
#color_profile=kai
#icc_profile=no

# HDR: no = tonemap to SDR, yes = pass HDR through to an HDR display
#hdr_passthrough=no
#target_peak=auto

# SVP motion interpolation. Needs SVP 4 and VapourSynth installed; Kai's .vpy files are copied.
#svp_enabled=no
#svp_global=no

# Audio preset: off (bit-perfect), or the ones ` (backtick) cycles through
#audio_preset=off

#osd_profile_messages=yes
#ultrawide_zoom=no

# Kai tells anime apart through its metadata database, which needs its web mods.
# Here only anime release groups in the file name are detected; set yes to treat
# everything as anime.
#force_anime=no
